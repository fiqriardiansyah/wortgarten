name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to the same branch/PR makes the in-flight run obsolete.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck / build / test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # No database in CI yet, so nothing connects — this only satisfies the
      # datasource block in schema.prisma so `prisma generate` can parse it.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/wortgarten
      # Present so anything reading them at import time gets a value, never a
      # real credential — no test in this repo calls out to a paid provider.
      BETTER_AUTH_SECRET: ci-not-a-real-secret
      BETTER_AUTH_URL: http://localhost:3026
      WEB_ORIGIN: http://localhost:5173
      STORY_IMAGES_ENABLED: 'false'
      TURBO_TELEMETRY_DISABLED: '1'

    steps:
      - uses: actions/checkout@v4

      # Reads the version from package.json's "packageManager" field.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Turbo's local cache: build/typecheck are cacheable, so unchanged
      # packages are restored instead of recompiled.
      - name: Restore turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      # generated/prisma is gitignored, so the client must be generated before
      # anything type-checks or compiles against it. Needs no live database.
      - name: Generate Prisma client
        run: pnpm run db:generate

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build
        run: pnpm run build

      # Most suites in this repo talk to a real Postgres (apps/api's whole
      # suite, 7 of 15 files in packages/ai, packages/images' attach-cover),
      # so with no database in CI only these two can run. This is an allowlist
      # on purpose: a new package's tests stay out until someone confirms they
      # need no services. Once a postgres service is added to this job, push
      # the schema with `pnpm run db:push` and replace this with `turbo run test`.
      - name: Test (suites that need no database)
        run: pnpm exec turbo run test --filter=@wortgarten/shared --filter=@wortgarten/audio
